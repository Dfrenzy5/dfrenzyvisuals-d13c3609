name: Phase 6 Bundle Analysis

on:
  push:
    branches:
      - perf/phase-6-bundle-measurement
  pull_request:
    branches:
      - main
    paths:
      - "vite.analyze.config.ts"
      - "scripts/report-build-sizes.mjs"
      - ".github/workflows/phase-6-bundle-analysis.yml"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-6-bundle-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Install temporary visualizer for this runner only
        run: bun add --dev rollup-plugin-visualizer

      - name: Build with module treemap
        run: bunx vite build --config vite.analyze.config.ts

      - name: Report built JS and CSS sizes
        run: bun run scripts/report-build-sizes.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Locate treemap report
        if: always()
        run: find . -name bundle-report.html -not -path './node_modules/*' -print

      - name: Upload bundle treemap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-bundle-treemap
          path: |
            **/bundle-report.html
          if-no-files-found: warn
          retention-days: 7
