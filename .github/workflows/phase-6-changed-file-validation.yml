name: Phase 6 Changed-File Validation
on:
  push:
    branches:
      - perf/phase-6-main-entry-split
permissions:
  contents: read
concurrency:
  group: phase-6-changed-file-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed application files
        run: >-
          bunx eslint
          src/components/BlueprintForm.tsx
          src/components/MeetTheDirector.tsx
          src/components/ui-studio/Container.tsx
          src/components/ui-studio/Section.tsx
          src/components/ui-studio/StudioButton.tsx
          src/components/ui-studio/studioButtonStyles.ts
          src/routes/ai-filmmaker.tsx
          src/routes/blueprint.tsx
          'src/routes/portfolio.$slug.tsx'
          src/routes/pricing.tsx
      - name: Production build
        run: bun run build
